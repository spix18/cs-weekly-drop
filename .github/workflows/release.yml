name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Verify build output
        run: test -f .millennium/Dist/index.js

      - name: Package plugin
        run: |
          mkdir -p package/cs-weekly-drop
          cp plugin.json package/cs-weekly-drop/
          cp -r .millennium package/cs-weekly-drop/
          (cd package && zip -r ../cs-weekly-drop.zip cs-weekly-drop)

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cs-weekly-drop.zip --title "$GITHUB_REF_NAME" --notes "CS Weekly Drop Reset $GITHUB_REF_NAME" --latest
